<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.15" />
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#050811" stop-opacity="0" />
    </radialGradient>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="#050811" />
  <circle cx="256" cy="235" r="185" fill="url(#bgGlow)" />

  <!-- Outer Cryptographic Ring -->
  <circle cx="256" cy="245" r="172" fill="none" stroke="#10B981" stroke-width="3.5" stroke-opacity="0.35" stroke-dasharray="16 10" />

  <!-- Shield Outer Geometry -->
  <path
    d="M256 68 L392 136 V244 C392 334 334 412 256 448 C178 412 120 334 120 244 V136 Z"
    fill="#090E1A"
    stroke="url(#shieldGrad)"
    stroke-width="14"
    stroke-linejoin="round"
    filter="url(#emeraldGlow)"
  />

  <!-- Shield Inner Core Plate -->
  <path
    d="M256 96 L368 152 V238 C368 312 322 376 256 410 C190 376 144 312 144 238 V152 Z"
    fill="#06121E"
    stroke="url(#glowGrad)"
    stroke-width="4.5"
    stroke-linejoin="round"
  />

  <!-- Cyber Lock Shackle -->
  <path
    d="M214 225 V192 C214 168.8 232.8 150 256 150 C279.2 150 298 168.8 298 192 V225"
    fill="none"
    stroke="#6EE7B7"
    stroke-width="13"
    stroke-linecap="round"
  />

  <!-- Lock Body Plate -->
  <rect x="198" y="220" width="116" height="88" rx="20" fill="url(#shieldGrad)" />

  <!-- Keyhole Core -->
  <circle cx="256" cy="254" r="8.5" fill="#050811" />
  <path d="M253 258 L248 284 H264 L259 258 Z" fill="#050811" />

  <!-- Lower Cryptographic Circuit Node -->
  <path d="M256 320 V360" stroke="#34D399" stroke-width="6.5" stroke-linecap="round" />
  <circle cx="256" cy="368" r="6" fill="#10B981" />
</svg>
